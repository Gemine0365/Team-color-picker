    let isSpinning = false;

    function drawTeamColor() {
      if (isSpinning) return;

      const allowClub = document.getElementById('chk-club').checked;
      const allowNation = document.getElementById('chk-nation').checked;

      if (!allowClub && !allowNation) {
        alert("최소 하나의 카테고리를 선택해주세요!");
        return;
      }

      const pool = TEAM_COLORS.filter(t => {
        if (t.category.includes("클럽 팀") && allowClub) return true;
        if (t.category === "국가대표" && allowNation) return true;
        return false;
      });

      isSpinning = true;

      const nameEl = document.getElementById('result-name');
      const categoryEl = document.getElementById('result-category');
      const logoBox = document.getElementById('logo-box');
      const logoEl = document.getElementById('result-logo');
      const btn = document.getElementById('draw-btn');

      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');

      let counter = 0;
      const duration = 1200;
      const intervalTime = 60;

      const timer = setInterval(() => {
        const randomTemp = pool[Math.floor(Math.random() * pool.length)];
        nameEl.innerText = randomTemp.name;
        categoryEl.innerText = randomTemp.category;
        categoryEl.classList.remove('opacity-0');
        
        logoBox.classList.remove('hidden');
        logoEl.src = randomTemp.logo;

        counter += intervalTime;
        if (counter >= duration) {
          clearInterval(timer);
          
          const finalResult = pool[Math.floor(Math.random() * pool.length)];
          nameEl.innerText = finalResult.name;
          categoryEl.innerText = finalResult.category;
          logoEl.src = finalResult.logo;

          confetti({
            particleCount: 50,
            spread: 60,
            origin: { y: 0.7 }
          });

          isSpinning = false;
          btn.disabled = false;
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      }, intervalTime);
    }
